# Lighthouse CI: the performance gate (.github/workflows/ci.yml, job
# `lighthouse`). It runs from frontend/ after a production build, against the
# seeded API on :8000 the e2e job uses: `npx @lhci/cli@0.15.1 autorun`.
ci:
  collect:
    # 127.0.0.1, not localhost: inside a container `localhost` resolves to ::1
    # first and vite preview then binds IPv6 only.
    startServerCommand: npx vite preview --host 127.0.0.1 --port 4173 --strictPort
    startServerReadyPattern: Local
    # The reader's ways in, on a phone: /benvenuto is the address printed on
    # the B&B cards, / is the map, /cosa-fare is where /benvenuto sends them.
    # Every route draws the map under it (design.md D13), so these three
    # measure the shell as well. The fourth is /cosa-fare with a zone chosen —
    # where «Dove sei?» and a chip both lead — on the zone `seed_e2e` fills
    # most (a church, a feast's route, a tour): its rows arrive after the page,
    # and the zone-less page never measured them (TD-53, CLS 0.204). The fifth
    # is a zone with nothing in it, Monte Orlando, as every zone in production
    # was on 2026-10-24: its few words come with the answers and were the
    # largest on the screen, LCP 3.26 s, until the page's note went above them
    # in the first frame (TD-54).
    #
    # The reader's language is on purpose (review PR-19a, translations.md T9):
    # those five in Italian — Chrome is told so below — and the home and «Cosa
    # si può fare qui» in English, by the address, as a shared link opens them.
    # English waits for a chunk of its own, which index.html asks for beside
    # the entry (vite.config.ts, preloadEnglish).
    url:
      - http://127.0.0.1:4173/benvenuto
      - http://127.0.0.1:4173/
      - http://127.0.0.1:4173/cosa-fare
      - http://127.0.0.1:4173/cosa-fare?zona=porto-salvo
      - http://127.0.0.1:4173/cosa-fare?zona=monte-orlando
      - http://127.0.0.1:4173/?lang=en
      - http://127.0.0.1:4173/cosa-fare?lang=en
    # Three runs per page; every assertion below reads the median.
    numberOfRuns: 3
    settings:
      # Lighthouse's default device is the reader this app is for (design.md:
      # logged-out, mobile-first): a mid-range phone on simulated slow 4G.
      onlyCategories: [performance]
      # OpenStreetMap's tile policy forbids headless bots, so the tiles are
      # never fetched here. The LCP this measures is therefore the app's own
      # text; what a tile adds on top is in TD-52, in the debt archive.
      blockedUrlPatterns: ['*tile.openstreetmap.org*']
      # Chrome will not start as root inside a container (act) without it; on
      # GitHub's own runner it changes nothing. And Italian: the app takes a
      # first visit's language from navigator.language, which on the Linux
      # runner is en-US — #147's first run measured every page in English.
      # Headless Chrome on Linux ignores --lang for navigator.language and
      # obeys --accept-lang (checked in a Linux container, 2026-10-25), and
      # Lighthouse sets no language of its own.
      chromeFlags: --no-sandbox --accept-lang=it-IT
  assert:
    assertions:
      # CLS at web.dev's "good" threshold. It does not depend on the machine:
      # 0.02–0.072 on every run, on a Mac and in a Linux container alike.
      cumulative-layout-shift: [error, { maxNumericValue: 0.1, aggregationMethod: median }]
      # LCP at web.dev's "good" threshold since TD-52 was paid (2026-10-15):
      # the map became a chunk of its own, fetched after the page paints.
      # Medians then: 1.84–1.85 s on a Mac and 1.76–1.94 s in a Linux
      # container (act), from 2.80–2.83 s and 2.70–2.74 s the same afternoon.
      # A page that needs more than 2.5 s to show its words is a regression;
      # never raise this to make a run green.
      largest-contentful-paint: [error, { maxNumericValue: 2500, aggregationMethod: median }]
      # TBT stays a regression budget, set over what a slower CPU measures
      # rather than at "good": it scales with the machine Lighthouse runs on,
      # and a gate that is red on a slow runner is a gate people learn to
      # ignore. TBT is the lab stand-in for INP, which needs a reader's input to
      # exist at all. Re-measured when TD-52 was paid: medians 5–14 ms on a Mac
      # and 84–206 ms under act, depending on what else the machine was running
      # (52–91 ms before, on a quiet one). Most of it, before and after, is one
      # task — the entry chunk's evaluation and first render, which Lantern
      # places after its FCP estimate; Leaflet's start-up now adds 5–50 ms of
      # its own, since it comes after the first paint. On a heavily loaded
      # machine (benchmarkIndex down to 165) one act run failed at a 552 ms
      # median, and the same kind of load had pushed a run of the old build to
      # 389 ms: this measures the runner as much as the app, which is why it
      # stays 300 and not 200. For scale, the editor's 124 KB (gzip) chunk would
      # cost ~0.6 s of LCP just to download on the simulated network if it ever
      # landed on the entry path.
      total-blocking-time: [error, { maxNumericValue: 300, aggregationMethod: median }]
  upload:
    # The reports stay on the runner and go up as a workflow artifact — never
    # to LHCI's temporary public storage, which publishes them at a public URL.
    target: filesystem
    outputDir: .lighthouseci/reports
