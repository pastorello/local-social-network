<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- The logo (design.md D7's note of 2026-10-26): the SVG where the
    browser takes one, the ICO (16/32/48) where it does not, and the touch
    icon a phone puts on its home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The map's tiles (src/lib/osm.ts): connect while the bundle loads. -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vivere Gaeta — le feste, le chiese, le ricette e i luoghi di Gaeta, raccontati sulla mappa."
    />
    <!-- The home's title (src/lib/pageTitle.ts): what a tab says until the
    router names the page it opened on. -->
    <title>Vivere Gaeta — la mappa di Gaeta</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
