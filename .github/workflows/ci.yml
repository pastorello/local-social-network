# Runs the five quality gates from the definition of done (spec §9) on every
# push to main and every pull request. Register item TD-01.
#
# Deliberately NOT here (see docs/tech-debt.md):
#   - no deploy step — there is nothing to deploy to (roadmap item 2, parked)
#   - no Postgres service — the suite runs on the SQLite fallback, which is what
#     every developer runs locally. Testing against Postgres too is a deliberate
#     later step, not an oversight.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend — pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # 3.14 matches backend/Dockerfile (python:3.14-slim).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Lint first: it takes a second and fails fast on style regressions.
      - name: Lint (ruff)
        run: python -m ruff check .

      # No POSTGRES_HOST, so settings.py falls back to SQLite.
      - name: Test (pytest)
        run: python -m pytest

  frontend:
    name: frontend — vitest + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # 22 matches frontend/Dockerfile (node:22-alpine) — the version the
      # shipped image builds with. package.json engines also allows 20.19+.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # The `prepare` script runs `cypress install`; skip the binary download
        # since no job here runs Cypress.
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci

      # `npm run lint` applies --fix, which would let CI pass by silently
      # rewriting files. These are the same two linters in check-only mode.
      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      # `npm run test:unit` is watch mode; `-- run` makes it a single pass.
      - name: Test (vitest)
        run: npm run test:unit -- run

      # Also type-checks: `build` is run-p type-check + vite build.
      - name: Build
        run: npm run build

  e2e:
    name: e2e — cypress
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The specs drive the real SPA against the real API (TD-04): stubbing it
      # would only test the stubs, and half of what is worth covering — a draft
      # staying invisible, a confidential overlay staying absent — is exactly
      # where the two sides could disagree.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      # DJANGO_DEBUG=true is required by seed_e2e, which refuses to run
      # otherwise — it creates accounts whose password is written down in a
      # spec file. SQLite, same as the backend job.
      - name: Start the API
        working-directory: backend
        env:
          DJANGO_DEBUG: 'true'
          CORS_ALLOWED_ORIGINS: 'http://localhost:4173,http://127.0.0.1:4173'
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/categories/ > /dev/null && exit 0
            sleep 1
          done
          echo "the API never came up:" && cat api.log && exit 1

      # `npm ci` downloads the binary through the `prepare` script; without this
      # that is ~100 MB on every run.
      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # `test:e2e` runs against a production build (vite preview on :4173), not
      # the dev server — that is the point. TD-02's double Leaflet bundle and the
      # default-import gotcha only appear in built output.
      - name: Build
        run: npm run build

      # The SPA's API base URL defaults to http://127.0.0.1:8000 (main.ts), which
      # is where the step above put it — so the production build needs no extra
      # environment here. It would if the API ever moved.
      - name: Run Cypress
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failures
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            backend/api.log
          if-no-files-found: ignore
          retention-days: 7
